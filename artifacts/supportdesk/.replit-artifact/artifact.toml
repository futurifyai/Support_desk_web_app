kind = "mobile"
previewPath = "/mobile/"
title = "SupportDesk"
description = "A support operations app for admins to triage customer tickets and for customers to submit and track issues across web and mobile."
version = "1.0.0"
id = "artifacts/supportdesk"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20485

[services.development]
run = "pnpm --filter @workspace/supportdesk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/supportdesk", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/supportdesk", "run", "serve" ]

[services.env]
PORT = "20485"
BASE_PATH = "/mobile/"
