openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SupportDesk API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: tickets
  - name: admin
  - name: help
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestBody"
      responses:
        "200":
          description: Reset email sent (account-enumeration-safe)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmBody"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/profile:
    get:
      operationId: getProfile
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
    patch:
      operationId: updateProfile
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"

  /auth/push-token:
    post:
      operationId: registerPushToken
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "200":
          description: Push token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /tickets:
    get:
      operationId: getTickets
      tags: [tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in-progress, resolved]
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [bug, feature, billing, account, other]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Tickets fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketsResponse"
    post:
      operationId: createTicket
      tags: [tickets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"

  /tickets/satisfaction:
    get:
      operationId: getTicketSatisfaction
      tags: [tickets]
      security:
        - bearerAuth: []
      summary: Customer satisfaction summary
      responses:
        "200":
          description: Satisfaction summary fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSatisfactionResponse"

  /users/me/products:
    get:
      operationId: getMyProducts
      tags: [tickets]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user's product access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProductsResponse"

  /tickets/{ticketId}:
    get:
      operationId: getUserTicketDetail
      tags: [tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket detail with replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTicketDetailResponse"

  /tickets/{ticketId}/replies:
    post:
      operationId: createUserTicketReply
      tags: [tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplyRequest"
      responses:
        "201":
          description: Reply posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyResponse"

  /tickets/{ticketId}/rating:
    patch:
      operationId: rateTicket
      tags: [tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateTicketRequest"
      responses:
        "200":
          description: Ticket rated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTicketDetailResponse"

  /tickets/{ticketId}/attachments:
    get:
      operationId: getTicketAttachments
      tags: [tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attachments fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentsResponse"
    post:
      operationId: uploadTicketAttachment
      tags: [tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadAttachmentRequest"
      responses:
        "201":
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalyticsResponse"

  /admin/users/ticket-stats:
    get:
      operationId: getAdminUserTicketStats
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Per-user ticket frequency with timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTicketStatsResponse"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: User directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
    post:
      operationId: createAdminUser
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Customer account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdminUserResponse"

  /admin/users/{userId}/products:
    get:
      operationId: getAdminUserProducts
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product access for one user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProductsResponse"
    post:
      operationId: createAdminUserProduct
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserProductRequest"
      responses:
        "201":
          description: Product access added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProductResponse"

  /admin/users/{userId}/products/{productId}:
    patch:
      operationId: updateAdminUserProduct
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProductRequest"
      responses:
        "200":
          description: Product access updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProductResponse"
    delete:
      operationId: deleteAdminUserProduct
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product access removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedUserProductResponse"

  /admin/products/distinct:
    get:
      operationId: getDistinctProductNames
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Existing product names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductNamesResponse"

  /admin/tickets:
    get:
      operationId: getAdminTickets
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in-progress, resolved]
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [bug, feature, billing, account, other]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        "200":
          description: All tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicketsResponse"

  /admin/tickets/{ticketId}:
    get:
      operationId: getAdminTicketDetail
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicketDetailResponse"

  /admin/tickets/{ticketId}/status:
    patch:
      operationId: updateTicketStatus
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicketDetailResponse"

  /admin/tickets/{ticketId}/priority:
    patch:
      operationId: updateTicketPriority
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePriorityRequest"
      responses:
        "200":
          description: Priority updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicketDetailResponse"

  /admin/tickets/{ticketId}/assign:
    patch:
      operationId: assignTicket
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTicketRequest"
      responses:
        "200":
          description: Ticket assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicketDetailResponse"

  /admin/tickets/{ticketId}/replies:
    get:
      operationId: getTicketReplies
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Replies fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepliesResponse"
    post:
      operationId: createTicketReply
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplyRequest"
      responses:
        "201":
          description: Reply posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyResponse"

  /admin/agents:
    get:
      operationId: getAdminAgents
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin agents list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsResponse"

  /admin/analytics/export.csv:
    get:
      operationId: exportAnalyticsCsv
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in-progress, resolved]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        "200":
          description: CSV file of tickets (bounded to 5000 rows)
          content:
            text/csv:
              schema:
                type: string

  /admin/analytics/export.pdf:
    get:
      operationId: exportAnalyticsPdf
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: PDF summary report of recent tickets
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /admin/audit-logs:
    get:
      operationId: getAuditLogs
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
        - name: actorId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit logs fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsResponse"

  /help/articles:
    get:
      operationId: getHelpArticles
      tags: [help]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [bug, feature, billing, account, other, general]
      responses:
        "200":
          description: Help articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticlesResponse"

  /help/articles/suggested:
    get:
      operationId: getSuggestedArticles
      tags: [help]
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [bug, feature, billing, account, other]
      responses:
        "200":
          description: Suggested articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticlesResponse"

  /help/articles/{slug}:
    get:
      operationId: getHelpArticle
      tags: [help]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Single help article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticleResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PasswordResetRequestBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    PasswordResetConfirmBody:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      required: [token, password]

    UserProfileFull:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: Replacement session token, returned only after a password change.
      required: [id, name, email, role, createdAt]

    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserProfileFull"
      required: [success, message, data]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    HelpArticle:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        body:
          type: string
        category:
          type: string
          enum: [bug, feature, billing, account, other, general]
        tags:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, slug, title, body, category, tags, createdAt, updatedAt]

    HelpArticlesResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/HelpArticle"
      required: [success, message, data]

    HelpArticleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/HelpArticle"
      required: [success, message, data]

    AuditLog:
      type: object
      properties:
        id:
          type: string
        actorId:
          type: string
          nullable: true
        actorEmail:
          type: string
          nullable: true
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          nullable: true
        meta:
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, action, resourceType, createdAt]

    AuditLogsResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
      required: [success, message, data]

    TopAgent:
      type: object
      properties:
        agentId:
          type: string
          nullable: true
        agentName:
          type: string
        resolvedCount:
          type: integer
      required: [agentId, agentName, resolvedCount]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
      required: [id, name, email, role]

    AdminUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, createdAt]

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [page, pageSize, total, totalPages]

    AdminUsersResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [success, message, data, meta]

    CreateAdminUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
      required: [name, email, password]

    CreateAdminUserResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/AdminUser"
            temporaryPassword:
